[project]
name = "procseg"
version = "0.1.0"
description = "Business-process segmentation from desktop operation logs"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
